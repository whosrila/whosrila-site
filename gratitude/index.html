<style>
@font-face {
  font-family: 'Whosrila';
  src: url('/fonts/whosrila.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root{
  --ink:        #0A0A0A;
  --ink-2:      #161616;
  --paper:      #F4F4F2;
  --paper-dim:  #8C8C8C;
  --red:        #D7263D;
  --line:       rgba(10,10,10,0.12);

  --f-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-body:    'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-mono: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
@media (max-width:760px){
  nav.links{ display:none; }
  .burger{ display:block; }
}

.embed-frame{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--paper);
  margin-bottom:16px;
}
.embed-frame iframe{ display:block; width:100%; border:0; }

.fallback{
  font-family:var(--f-mono); font-size:12px; letter-spacing:0.04em; color:var(--paper-dim);
  text-align:center; margin-bottom:8px;
}
.fallback a{ border-bottom:1px solid var(--red); color:var(--paper); padding-bottom:1px; }
.fallback a:hover{ color:var(--red); }

.preview-btn{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--ink); background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink); transition:background .2s, border-color .2s, color .2s;
}
.preview-btn:hover,.preview-btn.playing{
  background:var(--red); border-color:var(--red); color:#fff;
}
.preview-meta{ display:flex; flex-direction:column; gap:2px; }
.preview-tag{
  font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--paper-dim);
}

.quick-links{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 18px; }
.ql{
  display:inline-flex; align-items:center; gap:8px; flex:1 1 auto; justify-content:center;
  font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  padding:13px 18px; border-radius:3px; border:1px solid var(--line); color:var(--ink);
  transition:background .18s, color .18s, border-color .18s, transform .15s;
}
.ql:hover{ transform:translateY(-1px); }
.ql-spotify:hover{ background:#1DB954; border-color:#1DB954; color:#fff; }
.ql-apple:hover{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.ql-note{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--paper-dim); margin:0 0 8px;
}



/* ---------- Song page: media, preview and links share one column width ---------- */
.song-media{ width:100%; margin:0 0 18px; }
.song-media--art{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--ink-2);
}
.song-media--art img{ display:block; width:100%; height:auto; }
.song-media .vid-card{ display:flex; flex-direction:column; gap:9px; }
.song-media .vid-thumb{
  position:relative; display:block; width:100%; aspect-ratio:16/9; padding:0;
  border:1px solid var(--line); border-radius:6px; overflow:hidden;
  background:var(--ink-2); cursor:pointer;
}
.song-media .vid-thumb img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:grayscale(1) contrast(1.02) brightness(1.12); transition:filter .3s, transform .4s;
}
.song-media .vid-thumb:hover img{ filter:none; transform:scale(1.03); }
.song-media .vid-play{
  position:absolute; inset:0; margin:auto; width:54px; height:54px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(10,10,10,.6); color:#F4F4F2; border:1px solid rgba(244,244,242,.5);
  transition:background .2s, border-color .2s, transform .2s;
}
.song-media .vid-thumb:hover .vid-play{ background:var(--red); border-color:var(--red); transform:scale(1.07); }
.song-media .vid-thumb iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.song-media .vid-title{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--paper-dim);
}

.preview-player{
  display:flex; align-items:center; gap:15px; width:100%;
  padding:14px 18px; margin:0 0 18px;
  border:1px solid var(--line); border-radius:6px; background:var(--paper);
}

.listen-note{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--paper-dim); margin:0 0 9px;
}
.listen-list{ display:flex; flex-direction:column; gap:8px; margin:0 0 8px; }
.lrow{
  display:flex; align-items:center; gap:13px; width:100%;
  padding:14px 18px; border:1px solid var(--line); border-radius:4px;
  background:var(--paper); color:var(--ink);
  transition:border-color .16s, transform .14s;
}
.lrow:hover{ border-color:var(--ink); transform:translateY(-1px); }
.ldot{ width:9px; height:9px; border-radius:50%; flex:0 0 9px; }
.ltext{ display:flex; flex-direction:column; gap:1px; flex:1 1 auto; min-width:0; }
.lname{ font-weight:600; font-size:15px; line-height:1.25; }
.lsub{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--paper-dim);
}
.lgo{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--paper-dim); border:1px solid var(--line); border-radius:2px;
  padding:6px 13px; flex:0 0 auto; transition:background .16s, color .16s, border-color .16s;
}
.lrow:hover .lgo{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.lrow-buy{ border-color:var(--ink); }
.lrow-buy .lgo{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.lrow-buy:hover .lgo{ background:var(--red); border-color:var(--red); }
.ldot-spotify{background:#1DB954}.ldot-apple{background:#FA243C}.ldot-itunes{background:#A855F7}
.ldot-deezer{background:#A238FF}.ldot-tidal{background:#00D8D8}.ldot-soundcloud{background:#FF5500}
.ldot-audiomack{background:#FFA200}.ldot-pandora{background:#3668FF}

/* ---------- Video lightbox ----------
   Clicking a thumbnail flies the player from the card to the centre
   of the screen (FLIP: measure the card, invert, animate to identity)
   rather than embedding it inline in the grid. */
.lb{
  position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center;
  background:rgba(6,6,6,0.94); opacity:0; transition:opacity .3s ease;
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
}
.lb.open{ opacity:1; }
.lb-panel{
  position:relative; background:#000; overflow:hidden; border-radius:4px;
  border:1px solid rgba(244,244,242,0.16); box-shadow:0 30px 90px rgba(0,0,0,0.7);
  transform-origin:top left; will-change:transform;
}
.lb-panel iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.lb-close{
  position:fixed; top:20px; right:24px; width:44px; height:44px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  background:rgba(20,20,20,0.8); color:#F4F4F2; border:1px solid rgba(244,244,242,0.3);
  transition:background .2s, border-color .2s, transform .2s; z-index:2;
}
.lb-close:hover{ background:var(--red); border-color:var(--red); transform:rotate(90deg); }
.lb-cap{
  position:fixed; left:0; right:0; bottom:22px; text-align:center;
  font-family:var(--f-mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase;
  color:rgba(244,244,242,0.65); pointer-events:none; padding:0 24px;
}
@media (prefers-reduced-motion: reduce){
  .lb, .lb-panel{ transition:none !important; }
}


/* ---------- Watch / video grid ----------
   Default cards are 16:9 (music videos, visualisers, sessions).
   Add .video-grid--vertical for Shorts-format clips: YouTube serves
   those thumbnails padded into a 4:3 frame with blurred side-fill,
   so 9:16 + object-fit:cover crops the padding back off and leaves
   just the real vertical footage. */
.video-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:24px; margin-top:8px; }
.video-grid--vertical{ grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); max-width:900px; }
.video-subhead{ margin:52px 0 22px; }
.vid-card{ display:flex; flex-direction:column; gap:10px; }
.vid-thumb{
  position:relative; display:block; width:100%; aspect-ratio:16/9; padding:0;
  border:1px solid var(--line); background:var(--ink-2); overflow:hidden;
  cursor:pointer; border-radius:3px;
}
.video-grid--vertical .vid-thumb{ aspect-ratio:9/16; }
.vid-thumb img{
  width:100%; height:100%; object-fit:cover; display:block;
  filter:grayscale(1) contrast(1.05); transition:filter .3s, transform .4s;
}
.vid-thumb:hover img{ filter:grayscale(0) contrast(1); transform:scale(1.04); }
.vid-play{
  position:absolute; inset:0; margin:auto; width:56px; height:56px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(10,10,10,0.6); color:var(--paper); backdrop-filter:blur(2px);
  border:1px solid rgba(244,244,242,0.5);
  transition:background .2s, border-color .2s, transform .2s;
}
.vid-thumb:hover .vid-play{ background:var(--red); border-color:var(--red); transform:scale(1.08); }
.vid-thumb iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
.vid-num{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--red); }
.vid-title{ font-family:var(--f-body); font-weight:600; font-size:15px; color:var(--paper); line-height:1.3; margin-top:-4px; }
@media (max-width:560px){
  .video-grid{ grid-template-columns:1fr; gap:20px; }
  .video-grid--vertical{ grid-template-columns:repeat(2,1fr); gap:16px; }
  .vid-play{ width:44px; height:44px; }
  .vid-title{ font-size:14px; }
}

<script>

  btn.addEventListener('click',function(){
    if(audio.paused){
      var _p=audio.play(); if(_p&&_p.catch)_p.catch(function(){});btn.classList.add('playing');btn.innerHTML=PAUSE;tag.textContent='Playing…';
