name = "whosrila-downloads"
main = "src/worker.js"
compatibility_date = "2026-08-09"

# The audio lives here. Private bucket — no public access, no custom domain.
# The Worker is the only thing that can read it, which is the whole point.
[[r2_buckets]]
binding = "FILES"
bucket_name = "whosrila-downloads"

# Counts downloads per purchase so one link cannot be passed round forever.
# Created and bound in the dashboard on 9 Aug 2026; the Worker skips the cap
# entirely if this binding is ever absent, so it still deploys without it.
[[kv_namespaces]]
binding = "DOWNLOADS"
id = "1a7421556c0b451f8145b9ec495282c4"
