<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Energy — WHOSRILA</title>

<meta property="og:url" content="https://whosrila.com/energy">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Energy — WHOSRILA">
<meta name="twitter:description" content="Kum3ra ft. WHOSRILA — out September 11, 2026. Pre-save now.">
<meta name="twitter:image" content="https://whosrila.com/images/art-energy.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
:root{
  --ink:        #0A0A0A;
  --ink-2:      #161616;
  --paper:      #F4F4F2;
  --paper-dim:  #8C8C8C;
  --red:        #D7263D;
  --line:       rgba(10,10,10,0.12);

  --f-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-body:    'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-mono: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
*{ box-sizing:border-box; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--f-body); font-size:17px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
  min-height:100vh; display:flex; flex-direction:column;
}
a{ color:inherit; text-decoration:none; }
::selection{ background:var(--red); color:var(--ink); }
:focus-visible{ outline:2px solid var(--red); outline-offset:3px; }

.wrap{ width:100%; max-width:560px; margin:0 auto; padding:0 24px; }

header.site{ position:sticky; top:0; z-index:100; background:var(--paper); border-bottom:1px solid var(--line); }
.navrow{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; }
.logo-link img{ height:22px; width:auto; display:block; filter:invert(1); }
nav.links{ display:flex; gap:28px; font-family:var(--f-mono); font-size:13px; letter-spacing:0.06em; text-transform:uppercase; }
nav.links a{ opacity:1; color:var(--ink); transition:opacity .2s; border-bottom:1px solid transparent; padding-bottom:3px; }
nav.links a:hover{ opacity:1; border-color:var(--red); }
.burger{ display:none; background:none; border:0; color:var(--ink); font-size:22px; cursor:pointer; padding:0; line-height:1; }
@media (max-width:760px){
  nav.links{ display:none; }
  .burger{ display:block; }
}
.mobilenav{
  display:none; flex-direction:column; gap:0; border-top:1px solid var(--line);
}
.mobilenav a{
  padding:16px 28px; font-family:var(--f-mono); font-size:13px; letter-spacing:0.08em; text-transform:uppercase;
  border-bottom:1px solid var(--line);
}

main{ flex:1; display:flex; align-items:flex-start; padding:24px 0 48px; }

.stamp{
  font-family:var(--f-mono); font-size:12px; letter-spacing:0.16em; text-transform:uppercase;
  color:var(--red); display:inline-flex; align-items:center; gap:10px; margin-bottom:18px;
}
.stamp::before,.stamp::after{ content:"\25B8"; opacity:0.6; font-size:10px; }
.stamp::after{ content:"\25C2"; }

h1.title{
  font-family:var(--f-display); font-weight:400; font-size:clamp(24px,4vw,36px);
  line-height:0.92; margin:0 0 18px; text-transform:uppercase;
}
p.hook{ color:var(--paper-dim); font-size:18px; max-width:440px; margin:0 0 30px; }

.countdown{ display:flex; gap:18px; margin:0 0 32px; }
.countdown .cell{ text-align:center; }
.countdown .num{ font-family:var(--f-display); font-size:34px; line-height:1; }
.countdown .lab{ font-family:var(--f-mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--paper-dim); }

.embed-frame{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--paper);
  margin-bottom:16px;
}
.embed-frame iframe{ display:block; width:100%; border:0; }

.fallback{
  font-family:var(--f-mono); font-size:12px; letter-spacing:0.04em; color:var(--paper-dim);
  text-align:center; margin-bottom:8px;
}
.fallback a{ border-bottom:1px solid var(--red); color:var(--paper); padding-bottom:1px; }
.fallback a:hover{ color:var(--red); }

.preview-player{
  display:flex; align-items:center; gap:16px;
  padding:16px 20px; margin-bottom:16px;
  border:1px solid var(--line); border-radius:6px; background:var(--paper);
}
.preview-btn{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--ink); background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink); transition:background .2s, border-color .2s, color .2s;
}
.preview-btn:hover,.preview-btn.playing{
  background:var(--red); border-color:var(--red); color:#fff;
}
.preview-meta{ display:flex; flex-direction:column; gap:2px; }
.preview-tag{
  font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--paper-dim);
}

footer.mini{
  padding:24px 0; border-top:1px solid var(--line);
  font-family:var(--f-mono); font-size:11px; color:var(--paper-dim);
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;
}
footer.mini a{ border-bottom:1px solid var(--line); }
footer.mini a:hover{ color:var(--paper); border-color:var(--paper); }
.h2 { font-size: clamp(24px,3.5vw,38px); }

h1, h2, h3, .h1, .h2, .h3, .title { filter: brightness(0); }
</style>
</head>
<body>

<header class="site">
  <div class="navrow" id="navrow">
    <a href="/" class="logo-link"><img src="/images/logo.png" alt="WHOSRILA"></a>
    <nav class="links">
      <a href="/listen">Listen</a>
      <a href="/press">Press</a>
    </nav>
    <button class="burger" id="burgerBtn" aria-label="Toggle menu" aria-expanded="false">&#9776;</button>
  </div>
  <div class="mobilenav" id="mobileNav">
    <a href="/listen">Listen</a>
    <a href="/press">Press</a>
  </div>
</header>

<main>
  <div class="wrap">
    <span class="stamp">Upcoming Single &middot; Kum3ra ft. WHOSRILA</span>
    <h1 class="title">Energy</h1>
    <p class="hook">Kum3ra ft. WHOSRILA &mdash; pre-save it now, out September 11, 2026.</p>

    <div class="preview-player">
      <audio class="preview-audio" src="/audio/energy.m4a" preload="none"></audio>
      <button class="preview-btn" aria-label="Play preview">
        <svg width="14" height="14" viewBox="0 0 14 14"><polygon points="3,1 13,7 3,13" fill="currentColor"/></svg>
      </button>
      <div class="preview-meta">
        <span class="preview-tag">Preview</span>
      </div>
    </div>

    <!-- Countdown: delete this whole <div class="countdown">...</div> block for
         already-released songs. Only useful for pre-save / upcoming releases. -->
    <div class="countdown" id="countdown">
      <div class="cell"><div class="num" id="cd-days">--</div><div class="lab">Days</div></div>
      <div class="cell"><div class="num" id="cd-hours">--</div><div class="lab">Hrs</div></div>
      <div class="cell"><div class="num" id="cd-mins">--</div><div class="lab">Min</div></div>
    </div>

    <!-- =========================================================
      EDIT ME — paste your Feature.fm embed code here.
      In Feature.fm: open your campaign → Share/Embed → copy the
      iframe code → replace the src below with that URL.
      The height (900) can be adjusted to match what Feature.fm
      recommends for your specific campaign layout.
    ========================================================== -->
    <div class="embed-frame">
      <iframe
        src="https://too.fm/rrj4373?autoplay=1"
        width="100%" height="1300" frameborder="0" allowtransparency="true" scrolling="no"
        title="Energy — pre-save and listen">
      </iframe>
    </div>

    <p class="fallback">
      Trouble loading? <a href="https://too.fm/rrj4373" target="_blank" rel="noopener">Open directly</a>
    </p>
  </div>
</main>

<footer class="mini">
  <div class="wrap" style="display:flex; justify-content:space-between; width:100%;">
    <span>&copy; 2026 WHOSRILA LLC</span>
    <a href="/">whosrila.com</a>
  </div>
</footer>

<script>
  // EDIT ME — set this song's release date for the countdown.
  // If the song is already out, delete the countdown <div> above
  // and this whole script block.
  const RELEASE_DATE_ISO = '2026-09-11T00:00:00';

  function tick(){
    const target = new Date(RELEASE_DATE_ISO).getTime();
    const diff = Math.max(0, target - Date.now());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const d = document.getElementById('cd-days');
    const h = document.getElementById('cd-hours');
    const m = document.getElementById('cd-mins');
    if(d) d.textContent = days;
    if(h) h.textContent = String(hours).padStart(2,'0');
    if(m) m.textContent = String(mins).padStart(2,'0');
  }
  tick();
  setInterval(tick, 30000);
</script>

<script>
  (function(){
    var burger = document.getElementById('burgerBtn');
    var mobileNav = document.getElementById('mobileNav');
    if(burger && mobileNav){
      burger.addEventListener('click', function(){
        var open = mobileNav.style.display === 'flex';
        mobileNav.style.display = open ? 'none' : 'flex';
        burger.setAttribute('aria-expanded', String(!open));
      });
    }
  })();
</script>

<script>
(function(){
  var btn=document.querySelector('.preview-btn');
  var audio=document.querySelector('.preview-audio');
  var tag=document.querySelector('.preview-tag');
  if(!btn||!audio)return;
  var PLAY='<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="3,1 13,7 3,13" fill="currentColor"/></svg>';
  var PAUSE='<svg width="12" height="14" viewBox="0 0 12 14"><rect x="0" y="0" width="4" height="14" fill="currentColor"/><rect x="8" y="0" width="4" height="14" fill="currentColor"/></svg>';
  btn.addEventListener('click',function(){
    if(audio.paused){
      audio.play();btn.classList.add('playing');btn.innerHTML=PAUSE;tag.textContent='Playing…';
      audio.onended=function(){btn.classList.remove('playing');btn.innerHTML=PLAY;tag.textContent='Preview';};
    }else{
      audio.pause();audio.currentTime=0;btn.classList.remove('playing');btn.innerHTML=PLAY;tag.textContent='Preview';
    }
  });
})();
</script>

</body>
</html>
