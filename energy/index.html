<style>
:root{
  /* ---------- Energy: palette sampled from images/art-energy.jpg ----------
     The cover is a stone figure holding a gold heart on a near-black ground.
     Page ground is set to the artwork's own #010101 so the cover bleeds into
     the page instead of sitting in a box. --ink/--paper keep their structural
     meaning (foreground / background) but are inverted for this page, and
     --red carries the gold so every existing var(--red) accent follows. */
  --ink:        #F2EFE6;
  --ink-2:      #0C0C0C;
  --paper:      #010101;
  --paper-dim:  #8A8E8A;
  --red:        #C9A83F;
  --line:       rgba(242,239,230,0.13);
  --gold-hi:    #E8D45E;
  --stone:      #7E827E;
  --card:       #0C0C0C;

  --f-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-body:    'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-mono: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
@media (max-width:760px){
  nav.links{ display:none; }
  .burger{ display:block; }
}


.listen-list{ display:flex; flex-direction:column; gap:8px; margin:0 0 8px; }
.lrow{
  display:flex; align-items:center; gap:13px; width:100%;
  padding:14px 18px; border:1px solid var(--line); border-radius:4px;
  background:var(--paper); color:var(--ink);
  transition:border-color .16s, transform .14s;
}
.lrow:hover{ border-color:var(--ink); transform:translateY(-1px); }
.ldot{ width:9px; height:9px; border-radius:50%; flex:0 0 9px; }
.ltext{ display:flex; flex-direction:column; gap:1px; flex:1 1 auto; min-width:0; }
.lname{ font-weight:600; font-size:15px; line-height:1.25; }
.lsub{
  font-family:var(--f-mono); font-size:10px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--paper-dim);
}
.lgo{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--paper-dim); border:1px solid var(--line); border-radius:2px;
  padding:6px 13px; flex:0 0 auto; transition:background .16s, color .16s, border-color .16s;
}
.lrow:hover .lgo{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.lrow-buy{ border-color:var(--ink); }
.lrow-buy .lgo{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.lrow-buy:hover .lgo{ background:var(--red); border-color:var(--red); }
.ldot-spotify{background:#1DB954}.ldot-apple{background:#FA243C}.ldot-itunes{background:#A855F7}
.ldot-deezer{background:#A238FF}.ldot-tidal{background:#00D8D8}.ldot-soundcloud{background:#FF5500}
.ldot-audiomack{background:#FFA200}.ldot-pandora{background:#3668FF}
.ldot-amazon{background:#25D1DA}
.ldot-ytm{background:#FF0000}
@media (prefers-reduced-motion: reduce){ .lrow{ transition:none; } .lrow:hover{ transform:none; } }
.embed-frame{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--paper);
  margin-bottom:16px;
}
.embed-frame iframe{ display:block; width:100%; border:0; }

.fallback{
  font-family:var(--f-mono); font-size:12px; letter-spacing:0.04em; color:var(--paper-dim);
  text-align:center; margin-bottom:8px;
}
.fallback a{ border-bottom:1px solid var(--red); color:var(--ink); padding-bottom:1px; }
.fallback a:hover{ color:var(--red); }

.song-media{ width:100%; margin:0 0 18px; }
.song-media--art{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--ink-2);
}
.song-media--art img{ display:block; width:100%; height:auto; }

.preview-player{
  display:flex; align-items:center; gap:16px;
  padding:16px 20px; margin-bottom:16px;
  border:1px solid var(--line); border-radius:6px; background:var(--paper);
}
.preview-btn{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--ink); background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink); transition:background .2s, border-color .2s, color .2s;
}
.preview-btn:hover,.preview-btn.playing{
  background:var(--red); border-color:var(--red); color:#010101;
}
.preview-meta{ display:flex; flex-direction:column; gap:2px; }
.preview-tag{
  font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--paper-dim);
}

/* ---------- Cookie consent ---------- */
.cc{
  position:fixed; left:16px; right:16px; bottom:16px; z-index:300;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  max-width:760px; margin:0 auto; padding:16px 20px;
  background:#141414; color:#F4F4F2; border:1px solid rgba(244,244,242,.18);
  border-radius:6px; box-shadow:0 16px 48px rgba(0,0,0,.5);
  opacity:0; transform:translateY(14px); transition:opacity .26s ease, transform .26s ease;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
.cc-open{ opacity:1; transform:none; }
.cc-text{ margin:0; font-size:13.5px; line-height:1.5; flex:1 1 300px; color:rgba(244,244,242,.86); }
.cc-text a{ color:#F2EFE6; border-bottom:1px solid #C9A83F; }
.cc-actions{ display:flex; gap:10px; flex:0 0 auto; }
.cc-btn{
  font-family:inherit; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  padding:10px 20px; border-radius:3px; cursor:pointer; border:1px solid rgba(244,244,242,.35);
  background:transparent; color:#F4F4F2; transition:background .16s, color .16s, border-color .16s;
}
.cc-btn:hover{ border-color:#F4F4F2; }
.cc-yes{ background:#F4F4F2; color:#0A0A0A; border-color:#F4F4F2; }
.cc-yes:hover{ background:#C9A83F; border-color:#C9A83F; color:#010101; }
@media (prefers-reduced-motion: reduce){ .cc{ transition:none; } }

/* ---------- Back to top ---------- */
.to-top{
  position:fixed; right:20px; bottom:20px; z-index:120;
  width:46px; height:46px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:rgba(12,12,12,.80); color:var(--ink);
  border:1px solid rgba(242,239,230,.26);
  -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  cursor:pointer; opacity:0; transform:translateY(14px) scale(.9); pointer-events:none;
  transition:opacity .3s ease, transform .35s cubic-bezier(.22,.61,.36,1), background .2s, border-color .2s;
}
.to-top.show{ opacity:1; transform:none; pointer-events:auto; }
.to-top:hover{ background:var(--red); border-color:var(--red); color:#010101; }
.to-top svg{ display:block; }

@media (prefers-reduced-motion: reduce){ .to-top{ transition:opacity .2s ease; transform:none; } }
/* ---------- Dark-page corrections ----------
   Each of these is a rule that renders same-on-same once the palette flips. */

/* site.css inverts the white logo to black for the light site. Undo it here
   or the header mark is black on a black ground. */
.logo-link img{ filter:none; }

/* site.css line 38 forces every heading to filter:brightness(0) — pure black,
   which is invisible on this ground. Undo it and take the gold from the
   cover's own typography (KUM3RA / WHOSRILA are set in gold on the art). */
h1, h2, h3, .h1, .h2, .h3, .title{ filter:none; color:var(--gold-hi); }

/* site.css: footer.mini a:hover sets color to --paper, which is now the page
   background. Point it at the foreground instead. */
footer.mini a:hover{ color:var(--ink); border-color:var(--ink); }

/* site.css: ::selection paints --red behind --ink; on gold, text must go dark. */
::selection{ background:var(--red); color:#010101; }

/* Listen rows lift slightly off the ground so they read as cards. */
.lrow{ background:var(--card); }
.lrow:hover{ border-color:var(--gold-hi); }

/* The cover bleeds into the page — its own ground is the page ground. */
.song-media--art{ border:0; border-radius:0; background:transparent; }

.preview-player{ background:var(--card); }

/* ---------- Ground: light coming off the gold heart ----------
   The cover is a stone figure lit against black with the gold heart as the
   only light source. The page repeats that: a warm gold halo behind the
   title and art, a cooler stone haze below it, falling to the artwork's own
   #010101 at the edges. Fixed, so it reads as light in the room rather than
   as a panel that scrolls. */
body{
  background:
    radial-gradient(1100px 460px at 50% 2%,  rgba(201,168,63,0.17), transparent 58%),
    radial-gradient(820px 900px at 50% 92%, rgba(126,130,126,0.085), transparent 60%),
    radial-gradient(620px 460px at 50% 86%, rgba(201,168,63,0.06), transparent 62%),
    var(--paper);
  background-attachment: fixed;
  background-repeat: no-repeat;
}

/* Header floats over the gradient instead of capping it with a flat bar. */
header.site{
  background:rgba(1,1,1,0.62);
  -webkit-backdrop-filter:saturate(140%) blur(14px);
  backdrop-filter:saturate(140%) blur(14px);
  border-bottom:1px solid rgba(242,239,230,0.10);
}

/* The cover sits in its own pool of light. */
.song-media--art{
  position:relative;
  filter:drop-shadow(0 0 120px rgba(201,168,63,0.26));
}

/* ---------- Cards: lit glass, not flat swatches ---------- */
.lrow, .preview-player{
  background:linear-gradient(180deg, rgba(242,239,230,0.055), rgba(242,239,230,0.017));
  border-color:rgba(242,239,230,0.11);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
}
.lrow{ transition:border-color .18s, transform .16s, box-shadow .22s, background .18s; }
.lrow:hover{
  border-color:rgba(232,212,94,0.55);
  box-shadow:0 0 0 1px rgba(232,212,94,0.10), 0 10px 30px -12px rgba(201,168,63,0.45);
  background:linear-gradient(180deg, rgba(242,239,230,0.085), rgba(242,239,230,0.03));
}

/* Primary action carries the gold. */
.lrow-buy{
  border-color:rgba(232,212,94,0.48);
  box-shadow:0 0 26px -14px rgba(201,168,63,0.85);
}
.lrow-buy .lgo{ background:var(--gold-hi); color:#010101; border-color:var(--gold-hi); }
.lrow-buy:hover .lgo{ background:#F3E389; border-color:#F3E389; color:#010101; }

/* ---------- Platform dots: each one glows in its own brand colour ----------
   Driving background AND the halo off `color` keeps one declaration per
   platform instead of repeating each hex three times. */
.ldot{
  background:currentColor;
  box-shadow:0 0 11px -1px currentColor, 0 0 4px currentColor;
}
.ldot-spotify{color:#1DB954}.ldot-apple{color:#FA243C}.ldot-itunes{color:#A855F7}
.ldot-deezer{color:#A238FF}.ldot-tidal{color:#00D8D8}.ldot-soundcloud{color:#FF5500}
.ldot-audiomack{color:#FFA200}.ldot-pandora{color:#3668FF}
.ldot-amazon{color:#25D1DA}.ldot-ytm{color:#FF0000}

.lgo{ border-color:rgba(242,239,230,0.18); }
.lrow:hover .lgo{ background:var(--gold-hi); color:#010101; border-color:var(--gold-hi); }

/* Play control picks up the same gold ring. */
.preview-btn{ border-color:rgba(242,239,230,0.55); }
.preview-btn:hover,.preview-btn.playing{
  background:var(--gold-hi); border-color:var(--gold-hi); color:#010101;
  box-shadow:0 0 22px -4px rgba(232,212,94,0.75);
}
.to-top:hover{ background:var(--gold-hi); border-color:var(--gold-hi); color:#010101; }

@media (prefers-reduced-motion: reduce){
  .lrow{ transition:border-color .18s; }
  .lrow:hover{ transform:none; }
}

<script>
(function(){
  var b = document.getElementById('burgerBtn'), n = document.getElementById('mobileNav');
  if(!b || !n) return;
  // animate to the menu's real height. A fixed max-height has to be larger
  // than the content, so the visible part of the travel is over long before
  // the transition is, and it reads as a snap rather than a slide.
  function measure(){
    // scrollHeight reads ~0 while the element is still clamped, so lift the
    // cap, measure, put it back, then animate to the number
    var prev = n.style.maxHeight;
    n.style.transition = 'none';
    n.style.maxHeight = 'none';
    var px = n.scrollHeight;
    n.style.maxHeight = prev || '0px';
    void n.offsetHeight;
    n.style.transition = '';
    return px;
  }
  function setOpen(open){
    var px = open ? measure() : 0;
    // measure() suppresses the transition while it works. Restoring it and
    // setting the new height in the same frame lets the browser coalesce
    // them and skip straight to the end, so force a reflow between.
    void n.offsetHeight;
    n.classList.toggle('open', open);
    n.style.maxHeight = px + 'px';
    b.setAttribute('aria-expanded', String(open));
  }
  b.addEventListener('click', function(e){ e.preventDefault(); setOpen(!n.classList.contains('open')); });
  n.addEventListener('click', function(e){ if(e.target.closest('a')) setOpen(false); });
  window.addEventListener('resize', function(){ if(n.classList.contains('open')) n.style.maxHeight = measure() + 'px'; });
})();
</script>

<script>
(function(){
  var b = document.getElementById('toTop');
  if(!b) return;
  var reduce = false;
  try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){}
  // A flat 600px never fired on the shorter pages — /listen tops out at
  // 585px of scroll. Tied to the viewport instead, and only on pages with
  // enough length for it to be worth offering.
  function check(){
    var worthIt = document.documentElement.scrollHeight > innerHeight * 1.35;
    b.classList.toggle('show', worthIt && window.scrollY > innerHeight * 0.55);
  }
  check();
  window.addEventListener('scroll', check, { passive:true });
  b.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: reduce ? 'auto' : 'smooth' });
  });
})();
</script>
