<style>
@font-face {
  font-family: 'Whosrila';
  src: url('/fonts/whosrila.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
:root{
  --ink:        #0A0A0A;
  --ink-2:      #161616;
  --paper:      #F4F4F2;
  --paper-dim:  #8C8C8C;
  --red:        #D7263D;
  --line:       rgba(10,10,10,0.12);

  --f-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-body:    'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-mono: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
@media (max-width:760px){
  nav.links{ display:none; }
  .burger{ display:block; }
}

.embed-frame{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--paper);
  margin-bottom:16px;
}
.embed-frame iframe{ display:block; width:100%; border:0; }

.fallback{
  font-family:var(--f-mono); font-size:12px; letter-spacing:0.04em; color:var(--paper-dim);
  text-align:center; margin-bottom:8px;
}
.fallback a{ border-bottom:1px solid var(--red); color:var(--paper); padding-bottom:1px; }
.fallback a:hover{ color:var(--red); }

.preview-player{
  display:flex; align-items:center; gap:16px;
  padding:16px 20px; margin-bottom:16px;
  border:1px solid var(--line); border-radius:6px; background:var(--paper);
}
.preview-btn{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--ink); background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink); transition:background .2s, border-color .2s, color .2s;
}
.preview-btn:hover,.preview-btn.playing{
  background:var(--red); border-color:var(--red); color:#fff;
}
.preview-meta{ display:flex; flex-direction:column; gap:2px; }
.preview-tag{
  font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--paper-dim);
}

.quick-links{ display:flex; gap:10px; flex-wrap:wrap; margin:0 0 18px; }
.ql{
  display:inline-flex; align-items:center; gap:8px; flex:1 1 auto; justify-content:center;
  font-family:var(--f-mono); font-size:12px; letter-spacing:.06em; text-transform:uppercase;
  padding:13px 18px; border-radius:3px; border:1px solid var(--line); color:var(--ink);
  transition:background .18s, color .18s, border-color .18s, transform .15s;
}
.ql:hover{ transform:translateY(-1px); }
.ql-spotify:hover{ background:#1DB954; border-color:#1DB954; color:#fff; }
.ql-apple:hover{ background:var(--ink); border-color:var(--ink); color:var(--paper); }
.ql-note{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--paper-dim); margin:0 0 8px;
}

/* ---------- Streaming links (replaces the Feature.fm embed) ---------- */
.listen-list{ display:flex; flex-direction:column; gap:8px; margin:0 0 20px; }
.lrow{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  padding:15px 20px; border:1px solid var(--line); border-radius:4px;
  background:var(--paper); color:var(--ink);
  transition:background .16s, color .16s, border-color .16s, transform .14s;
}
.lrow:hover{ transform:translateY(-1px); border-color:var(--ink); }
.lname{ font-weight:600; font-size:15px; display:flex; align-items:center; gap:11px; }
.ldot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.ldot-spotify{ background:#1DB954; }  .ldot-apple{ background:#FA243C; }
.ldot-itunes{ background:#A855F7; }   .ldot-deezer{ background:#A238FF; }
.ldot-tidal{ background:#00FFFF; outline:1px solid rgba(10,10,10,.25); }
.ldot-soundcloud{ background:#FF5500; } .ldot-audiomack{ background:#FFA200; }
.ldot-pandora{ background:#3668FF; }
.lgo{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--paper-dim); border:1px solid var(--line); border-radius:2px; padding:6px 13px;
  transition:background .16s, color .16s, border-color .16s; flex-shrink:0;
}
.lrow:hover .lgo{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.listen-note{
  font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--paper-dim); margin:0 0 10px;
}

<script>
  (function(){
    var burger = document.getElementById('burgerBtn');
    var mobileNav = document.getElementById('mobileNav');
    if(burger && mobileNav){
      burger.addEventListener('click', function(){
        var open = mobileNav.style.display === 'flex';
        mobileNav.style.display = open ? 'none' : 'flex';
        burger.setAttribute('aria-expanded', String(!open));
      });
    }
  })();
</script>

<script>
(function(){
  var btn=document.querySelector('.preview-btn');
  var audio=document.querySelector('.preview-audio');
  var tag=document.querySelector('.preview-tag');
  if(!btn||!audio)return;
  var PLAY='<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="3,1 13,7 3,13" fill="currentColor"/></svg>';
  var PAUSE='<svg width="12" height="14" viewBox="0 0 12 14"><rect x="0" y="0" width="4" height="14" fill="currentColor"/><rect x="8" y="0" width="4" height="14" fill="currentColor"/></svg>';
  btn.addEventListener('click',function(){
    if(audio.paused){
      var _p=audio.play(); if(_p&&_p.catch)_p.catch(function(){});btn.classList.add('playing');btn.innerHTML=PAUSE;tag.textContent='Playing…';
      audio.onended=function(){btn.classList.remove('playing');btn.innerHTML=PLAY;tag.textContent='Preview';};
    }else{
      audio.pause();audio.currentTime=0;btn.classList.remove('playing');btn.innerHTML=PLAY;tag.textContent='Preview';
    }
  });
})();
</script>
