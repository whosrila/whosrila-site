:root{

  --paper-dim:  #8C8C8C;

@media (max-width:760px){

.fallback{
  font-family:var(--f-mono); font-size:12px; letter-spacing:0.04em; color:var(--paper-dim);

}
.fallback a{ border-bottom:1px solid var(--red); color:var(--paper); padding-bottom:1px; }
.fallback a:hover{ color:var(--red); }

/* ---------- Cookie consent ---------- */
.cc{
  position:fixed; left:16px; right:16px; bottom:16px; z-index:300;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  max-width:760px; margin:0 auto; padding:16px 20px;
  background:#141414; color:#F4F4F2; border:1px solid rgba(244,244,242,.18);
  border-radius:6px; box-shadow:0 16px 48px rgba(0,0,0,.5);
  opacity:0; transform:translateY(14px); transition:opacity .26s ease, transform .26s ease;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
.cc-open{ opacity:1; transform:none; }
.cc-text{ margin:0; font-size:13.5px; line-height:1.5; flex:1 1 300px; color:rgba(244,244,242,.86); }
.cc-text a{ color:#F4F4F2; border-bottom:1px solid #D7263D; }
.cc-actions{ display:flex; gap:10px; flex:0 0 auto; }
.cc-btn{
  font-family:inherit; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  padding:10px 20px; border-radius:3px; cursor:pointer; border:1px solid rgba(244,244,242,.35);
  background:transparent; color:#F4F4F2; transition:background .16s, color .16s, border-color .16s;
}
.cc-btn:hover{ border-color:#F4F4F2; }
.cc-yes{ background:#F4F4F2; color:#0A0A0A; border-color:#F4F4F2; }
.cc-yes:hover{ background:#D7263D; border-color:#D7263D; color:#F4F4F2; }

<script>
  // EDIT ME — set this song's release date for the countdown.
  // If the song is already out, delete the countdown <div> above
  // and this whole script block.
  const RELEASE_DATE_ISO = '2026-08-13T00:00:00';

  function tick(){
    const target = new Date(RELEASE_DATE_ISO).getTime();
    const diff = Math.max(0, target - Date.now());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const d = document.getElementById('cd-days');
    const h = document.getElementById('cd-hours');
    const m = document.getElementById('cd-mins');
    if(d) d.textContent = days;
    if(h) h.textContent = String(hours).padStart(2,'0');
    if(m) m.textContent = String(mins).padStart(2,'0');
  }
  tick();
  setInterval(tick, 30000);
</script>

<script>
  (function(){
    var burger = document.getElementById('burgerBtn');
    var mobileNav = document.getElementById('mobileNav');
    if(burger && mobileNav){
      burger.addEventListener('click', function(){
        var open = mobileNav.style.display === 'flex';
        mobileNav.style.display = open ? 'none' : 'flex';
        burger.setAttribute('aria-expanded', String(!open));
      });
    }
  })();
</script>
