<style>
@font-face {
  font-family: 'Whosrila';
  src: url('/fonts/whosrila.ttf') format('truetype');

  font-style: normal;
  font-display: swap;

:root{
  --ink:        #0A0A0A;
  --ink-2:      #161616;
  --paper:      #F4F4F2;
  --paper-dim:  #8C8C8C;
  --red:        #D7263D;
  --line:       rgba(10,10,10,0.12);

  --f-display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-body:    'Helvetica Neue', Helvetica, Arial, sans-serif;
  --f-mono: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
@media (max-width:760px){
  nav.links{ display:none; }
  .burger{ display:block; }
}

.song-media{ width:100%; margin:0 0 18px; }
.song-media--art{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--ink-2);
}
.song-media--art img{ display:block; width:100%; height:auto; }

.preview-player{
  display:flex; align-items:center; gap:16px;
  padding:16px 20px; margin-bottom:16px;
  border:1px solid var(--line); border-radius:6px; background:var(--paper);
}
.preview-btn{
  width:44px; height:44px; border-radius:50%; flex-shrink:0;
  border:2px solid var(--ink); background:transparent; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--ink); transition:background .2s, border-color .2s, color .2s;
}
.preview-btn:hover,.preview-btn.playing{
  background:var(--red); border-color:var(--red); color:#fff;
}
.preview-meta{ display:flex; flex-direction:column; gap:2px; }
.preview-tag{
  font-family:var(--f-mono); font-size:11px; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--paper-dim);
}

.embed-frame{
  border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--paper);
  margin-bottom:16px;
}
.embed-frame iframe{ display:block; width:100%; border:0; }

.fallback{
  font-family:var(--f-mono); font-size:12px; letter-spacing:0.04em; color:var(--paper-dim);
  text-align:center; margin-bottom:8px;
}
.fallback a{ border-bottom:1px solid var(--red); color:var(--paper); padding-bottom:1px; }
.fallback a:hover{ color:var(--red); }

/* ---------- Cookie consent ---------- */
.cc{
  position:fixed; left:16px; right:16px; bottom:16px; z-index:300;
  display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  max-width:760px; margin:0 auto; padding:16px 20px;
  background:#141414; color:#F4F4F2; border:1px solid rgba(244,244,242,.18);
  border-radius:6px; box-shadow:0 16px 48px rgba(0,0,0,.5);
  opacity:0; transform:translateY(14px); transition:opacity .26s ease, transform .26s ease;
  font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
.cc-open{ opacity:1; transform:none; }
.cc-text{ margin:0; font-size:13.5px; line-height:1.5; flex:1 1 300px; color:rgba(244,244,242,.86); }
.cc-text a{ color:#F4F4F2; border-bottom:1px solid #D7263D; }
.cc-actions{ display:flex; gap:10px; flex:0 0 auto; }
.cc-btn{
  font-family:inherit; font-size:12px; letter-spacing:.08em; text-transform:uppercase;
  padding:10px 20px; border-radius:3px; cursor:pointer; border:1px solid rgba(244,244,242,.35);
  background:transparent; color:#F4F4F2; transition:background .16s, color .16s, border-color .16s;
}
.cc-btn:hover{ border-color:#F4F4F2; }
.cc-yes{ background:#F4F4F2; color:#0A0A0A; border-color:#F4F4F2; }
.cc-yes:hover{ background:#D7263D; border-color:#D7263D; color:#F4F4F2; }
@media (prefers-reduced-motion: reduce){ .cc{ transition:none; } }

<script>
  // EDIT ME — set this song's release date for the countdown.
  // If the song is already out, delete the countdown <div> above
  // and this whole script block.
  const RELEASE_DATE_ISO = '2026-08-13T00:00:00';

  const cdEl = document.getElementById('countdown');

  function tick(){
    const target = new Date(RELEASE_DATE_ISO).getTime();
    const diff = target - Date.now();

    // Release day. Stop counting and say so — a clock frozen at 0/00/00
    // reads as broken, and this page may sit here a while before it's
    // rebuilt as a released-song page.
    if(diff <= 0){
      if(cdEl){
        cdEl.classList.add('done');
        cdEl.innerHTML = '<span class="cd-live">Out now</span>';
      }
      clearInterval(timer);
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const d = document.getElementById('cd-days');
    const h = document.getElementById('cd-hours');
    const m = document.getElementById('cd-mins');
    if(d) d.textContent = days;
    if(h) h.textContent = String(hours).padStart(2,'0');
    if(m) m.textContent = String(mins).padStart(2,'0');
  }
  // assigned before the first tick so tick() can always clear it
  const timer = setInterval(tick, 30000);
  tick();
</script>

</script>

<script>
(function(){
  var btn=document.querySelector('.preview-btn');
  var audio=document.querySelector('.preview-audio');
  var tag=document.querySelector('.preview-tag');
  if(!btn||!audio)return;
  var PLAY='<svg width="14" height="14" viewBox="0 0 14 14"><polygon points="3,1 13,7 3,13" fill="currentColor"/></svg>';
  var PAUSE='<svg width="12" height="14" viewBox="0 0 12 14"><rect x="0" y="0" width="4" height="14" fill="currentColor"/><rect x="8" y="0" width="4" height="14" fill="currentColor"/></svg>';
  btn.addEventListener('click',function(){
    if(audio.paused){
      var _p=audio.play(); if(_p&&_p.catch)_p.catch(function(){});btn.classList.add('playing');btn.innerHTML=PAUSE;tag.textContent='Playing…';
      audio.onended=function(){btn.classList.remove('playing');btn.innerHTML=PLAY;tag.textContent='Preview';};
    }else{
      audio.pause();audio.currentTime=0;btn.classList.remove('playing');btn.innerHTML=PLAY;tag.textContent='Preview';
    }
  });
})();
</script>
